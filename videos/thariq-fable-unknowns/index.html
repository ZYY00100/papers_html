<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Thariq · Finding Your Unknowns · 视频演示</title>
<meta name="viewport" content="width=1920, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@300;400;500;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #F5F5F7;
    overflow: hidden;
    font-family: 'Noto Serif SC', 'Cormorant Garamond', serif;
    color: #1D1D1F;
  }

  /* Root composition is 1920x1080; sub-compositions stack absolutely on top. */
  [data-composition-id="root"] {
    position: relative;
    width: 1920px;
    height: 1080px;
  }

  /* Stack sub-compositions on the same canvas, each absolutely positioned */
  [data-composition-id="root"] > [data-composition-id] {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
  }
</style>
</head>
<body>
  <div data-hf-id="hf-root" data-composition-id="root" data-width="1920" data-height="1080" data-start="0" data-duration="180">

    <!-- BEAT 1 — HOOK (0:00–0:14) -->
    <div data-hf-id="hf-b01" id="el-beat-1" data-composition-id="beat-01-hook" data-composition-src="compositions/beat-01-hook.html" data-start="0" data-duration="14" data-track-index="1"></div>

    <!-- BEAT 2 — MAP vs TERRITORY (0:14–0:28) -->
    <div data-hf-id="hf-b02" id="el-beat-2" data-composition-id="beat-02-map-vs-territory" data-composition-src="compositions/beat-02-map-vs-territory.html" data-start="14" data-duration="14" data-track-index="1"></div>

    <!-- BEAT 3 — 4 UNKNOWNS / RUMSFELD (0:28–0:46) — KEY VISUAL -->
    <div data-hf-id="hf-b03" id="el-beat-3" data-composition-id="beat-03-rumsfeld" data-composition-src="compositions/beat-03-rumsfeld.html" data-start="28" data-duration="18" data-track-index="1"></div>

    <!-- BEAT 4 — HELP CLAUDE (0:46–0:56) -->
    <div data-hf-id="hf-b04" id="el-beat-4" data-composition-id="beat-04-help-claude" data-composition-src="compositions/beat-04-help-claude.html" data-start="46" data-duration="10" data-track-index="1"></div>

    <!-- BEAT 5 — PRE-IMPL 章扉 (0:56–1:04) -->
    <div data-hf-id="hf-b05" id="el-beat-5" data-composition-id="beat-05-pre-impl" data-composition-src="compositions/beat-05-pre-impl.html" data-start="56" data-duration="8" data-track-index="1"></div>

    <!-- BEAT 6 — BLIND SPOT (1:04–1:18) -->
    <div data-hf-id="hf-b06" id="el-beat-6" data-composition-id="beat-06-blind-spot" data-composition-src="compositions/beat-06-blind-spot.html" data-start="64" data-duration="14" data-track-index="1"></div>

    <!-- BEAT 7 — BRAINSTORM (1:18–1:32) -->
    <div data-hf-id="hf-b07" id="el-beat-7" data-composition-id="beat-07-brainstorm" data-composition-src="compositions/beat-07-brainstorm.html" data-start="78" data-duration="14" data-track-index="1"></div>

    <!-- BEAT 8 — INTERVIEW (1:32–1:44) -->
    <div data-hf-id="hf-b08" id="el-beat-8" data-composition-id="beat-08-interview" data-composition-src="compositions/beat-08-interview.html" data-start="92" data-duration="12" data-track-index="1"></div>

    <!-- BEAT 9 — REFERENCES (1:44–1:58) -->
    <div data-hf-id="hf-b09" id="el-beat-9" data-composition-id="beat-09-references" data-composition-src="compositions/beat-09-references.html" data-start="104" data-duration="14" data-track-index="1"></div>

    <!-- BEAT 10 — IMPL PLAN (1:58–2:12) -->
    <div data-hf-id="hf-b10" id="el-beat-10" data-composition-id="beat-10-impl-plan" data-composition-src="compositions/beat-10-impl-plan.html" data-start="118" data-duration="14" data-track-index="1"></div>

    <!-- BEAT 11 — IMPL NOTES (2:12–2:24) -->
    <div data-hf-id="hf-b11" id="el-beat-11" data-composition-id="beat-11-impl-notes" data-composition-src="compositions/beat-11-impl-notes.html" data-start="132" data-duration="12" data-track-index="1"></div>

    <!-- BEAT 12 — PITCH + QUIZ (2:24–2:38) -->
    <div data-hf-id="hf-b12" id="el-beat-12" data-composition-id="beat-12-pitch-quiz" data-composition-src="compositions/beat-12-pitch-quiz.html" data-start="144" data-duration="14" data-track-index="1"></div>

    <!-- BEAT 13 — FABLE + CTA (2:38–3:00) -->
    <div data-hf-id="hf-b13" id="el-beat-13" data-composition-id="beat-13-fable-cta" data-composition-src="compositions/beat-13-fable-cta.html" data-start="158" data-duration="22" data-track-index="1"></div>

    <!-- AUDIO: BGM track -->
    <audio data-hf-id="hf-bgm" id="el-bgm" data-start="0" data-duration="180" data-track-index="2" src="audio/bgm-lofi.wav" data-volume="0.7"></audio>

    <!-- AUDIO: TTS narration (filled in Stage 5) -->
    <audio data-hf-id="hf-narration" id="el-narration" data-start="0" data-duration="180" data-track-index="3" src="audio/narration.wav" data-volume="1.0"></audio>

  </div>

  <script>
    // Root composition — no GSAP timeline at this layer.
    // Each sub-composition manages its own internal timeline.
    // The framework coordinates visibility via data-start / data-duration.
    window.__timelines = window.__timelines || {};
    window.__timelines["root"] = gsap.timeline({ paused: true });
  </script>
</body>
</html>
